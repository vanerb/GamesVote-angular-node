<section
  class="loading-card"
  role="status"
  aria-live="polite"
>
  <div class="loading-visual" aria-hidden="true">

    <span class="loading-orbit orbit-one"></span>

    <span class="loading-orbit orbit-two"></span>

    <span class="loading-core">
      <i class="bi bi-controller"></i>
    </span>

  </div>

  <span class="loading-kicker">
    GAMESVOTE
  </span>

  <p>
    {{ text || 'Cargando tu próxima aventura…' }}
  </p>

  <div
    class="loading-progress"
    aria-hidden="true"
  >
    <span></span>
  </div>
</section>
